services:
  postgres:
    image: postgres:16
    container_name: poprush-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: poprush
      POSTGRES_USER: poprush
      POSTGRES_PASSWORD: poprush
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: poprush-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
